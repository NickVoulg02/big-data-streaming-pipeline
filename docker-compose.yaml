services:
  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Local MongoDB Database
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db  # Saves your data permanently

# The Data Generator & Producer
  kafka-producer:
    build: .
    volumes:
      - .:/app
    depends_on:
      - kafka
    env_file:
      - .env
    # This runs the simulation first, then immediately starts streaming the data
    command: sh -c "python simulation.py && python kafka_producer.py"

  # Spark Processing Pipeline
  spark-processor:
    build: .
    volumes:
      - .:/app
    depends_on:
      - kafka
      - mongo
    env_file:
      - .env
    # This automatically boots up Spark and starts listening
    command: sh -c "sleep 15 && python spark_mongo_pipeline.py"

# This declares the permanent storage volume for MongoDB
volumes:
  mongo_data: